spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/users/**

            - id: dispute-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/disputes/**

            - id: Transaction-services
              uri: http://localhost:8084
              predicates:
                  - Path=/transactions/**


server:
  port: 8083